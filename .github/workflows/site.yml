name: Site

on:
  push:
    branches: [main]
    paths: [site/**]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out the site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rognlien/maendeleo-site
          token: ${{ secrets.SITE_TOKEN }}
          path: maendeleo-site

      # The site's srv folder becomes exactly what site/ holds; its look comes from the site.
      - name: Publish the page
        working-directory: maendeleo-site
        run: |
          rsync -a --delete ../site/ srv/
          git add -A srv
          if git diff --cached --quiet; then
            echo "The site already has this page."
          else
            git config user.name "$GITHUB_ACTOR"
            git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
            git commit -m "Update the srv page from srv@${GITHUB_SHA::7}"
            git push origin main
          fi
