name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linuxX64
            gradle_target: LinuxX64
          - runner: macos-latest
            target: macosArm64
            gradle_target: MacosArm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts') }}

      - name: Unit tests
        run: ./gradlew ${{ matrix.target }}Test linkDebugExecutable${{ matrix.gradle_target }}

      - name: End-to-end tests
        run: python3 test/e2e.py build/bin/${{ matrix.target }}/debugExecutable/srv.kexe
