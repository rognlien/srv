name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts') }}

      - name: Build
        run: ./gradlew linkReleaseExecutableMacosArm64 linkReleaseExecutableMacosX64 -Pversion="${GITHUB_REF_NAME#v}"

      - name: Package
        run: |
          mkdir dist
          for target in macosArm64:arm64 macosX64:x86_64; do
            gradle_target="${target%%:*}"
            architecture="${target##*:}"
            archive="srv-${GITHUB_REF_NAME}-macos-${architecture}.tar.gz"
            cp "build/bin/${gradle_target}/releaseExecutable/srv.kexe" dist/srv
            cp man/srv.1 dist/srv.1
            cp LICENSE dist/LICENSE
            tar -czf "dist/${archive}" -C dist srv srv.1 LICENSE
            rm dist/srv dist/srv.1 dist/LICENSE
          done
          (cd dist && shasum -a 256 *.tar.gz > checksums.txt)
          cat dist/checksums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
