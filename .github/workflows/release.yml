name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts') }}

      - name: Build
        run: >-
          ./gradlew -Pversion="${GITHUB_REF_NAME#v}"
          linkReleaseExecutableMacosArm64 linkReleaseExecutableMacosX64
          linkReleaseExecutableLinuxX64 linkReleaseExecutableLinuxArm64

      - name: Package
        run: |
          mkdir dist
          for target in macosArm64:aarch64-apple-darwin macosX64:x86_64-apple-darwin linuxArm64:aarch64-unknown-linux-gnu linuxX64:x86_64-unknown-linux-gnu; do
            gradle_target="${target%%:*}"
            platform="${target##*:}"
            archive="srv-${GITHUB_REF_NAME}-${platform}.tar.gz"
            cp "build/bin/${gradle_target}/releaseExecutable/srv.kexe" dist/srv
            cp man/srv.1 dist/srv.1
            cp LICENSE dist/LICENSE
            tar -czf "dist/${archive}" -C dist srv srv.1 LICENSE
            rm dist/srv dist/srv.1 dist/LICENSE
          done
          (cd dist && shasum -a 256 *.tar.gz > checksums.txt)
          cat dist/checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
